<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영단어 카드</title>
<meta name="theme-color" content="#15803d">
<meta name="description" content="학생이 자기 손으로 단어장을 만들고 카드로 외우는 영단어 플래시카드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 안내 배너 (저장 불가 · 복구 안내 · PWA 안내, 기본 숨김) -->
  <div id="banner" class="banner" role="status" hidden></div>

  <!-- ============ 학습 화면 ============ -->
  <div id="learnScreen">
    <header class="topbar">
      <div class="menu-wrap">
        <button id="menuBtn" class="icon-btn" aria-label="메뉴" aria-haspopup="true" aria-expanded="false" type="button">&#9776;</button>
        <div id="menuDropdown" class="menu-dropdown" hidden>
          <button type="button" data-route="#/manage">단어 관리</button>
          <button type="button" data-route="#/settings">설정</button>
        </div>
      </div>
      <span class="app-name">영단어 카드</span>
      <button id="quickAddBtn" class="quick-add-btn" type="button">+ 단어</button>
      <span id="progressText" class="progress-text"></span>
    </header>
    <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>

    <div id="filterBar" class="filter-bar">
      <div class="tabs" role="tablist">
        <button class="tab" data-filter="unmemorized" type="button" role="tab">미암기</button>
        <button class="tab" data-filter="all" type="button" role="tab">전체</button>
        <button class="tab" data-filter="memorized" type="button" role="tab">암기 완료</button>
      </div>
      <button id="shuffleToggle" class="shuffle-toggle" type="button" aria-pressed="false">&#128256; 섞기</button>
    </div>

    <main id="stage" class="stage">
      <!-- 학습 카드 -->
      <div id="card" class="card" tabindex="0" role="button" aria-label="카드, 눌러서 뜻 보기">
        <div class="card-inner">
          <div class="card-face card-front">
            <button id="speakFrontBtn" class="speak-btn" type="button" aria-label="영단어 발음 듣기">&#128264;</button>
            <p id="wordText" class="word"></p>
            <p class="hint">탭해서 뜻 보기</p>
          </div>
          <div class="card-face card-back" aria-live="polite">
            <button id="speakBackBtn" class="speak-btn" type="button" aria-label="영단어 발음 듣기">&#128264;</button>
            <p id="meaningText" class="meaning"></p>
            <p id="posText" class="pos"></p>
            <p id="exampleText" class="example"></p>
          </div>
        </div>
      </div>

      <!-- 단어 없음 / 완료 화면 (F-12) -->
      <div id="emptyState" class="empty-state" hidden>
        <p id="emptyTitle" class="empty-title"></p>
        <p id="emptySub" class="empty-sub"></p>
        <div id="emptyActions" class="empty-actions"></div>
      </div>
    </main>

    <div id="controls" class="controls">
      <button id="prevBtn" class="btn btn-secondary" type="button">이전</button>
      <button id="memorizeBtn" class="btn btn-primary" type="button">암기 완료</button>
      <button id="nextBtn" class="btn btn-secondary" type="button">다음</button>
    </div>

    <div id="shortcutHint" class="shortcut-hint">&larr; 이전 &middot; Space 뒤집기 &middot; &rarr; 다음 &middot; Enter 암기 완료</div>
  </div>

  <!-- ============ 단어 관리 화면 ============ -->
  <div id="manageScreen" hidden>
    <header class="topbar">
      <button id="backBtn" class="icon-btn" aria-label="뒤로 가기" type="button">&larr;</button>
      <span class="app-name">단어 관리</span>
      <span id="manageCount" class="progress-text"></span>
    </header>

    <div class="manage-body">
      <section class="add-form">
        <div class="field-row">
          <input id="inputWord" class="field" type="text" placeholder="영단어" maxlength="50">
          <input id="inputMeaning" class="field" type="text" placeholder="뜻" maxlength="100">
        </div>
        <div class="field-row">
          <input id="inputPos" class="field field-small" type="text" placeholder="품사 (선택)" maxlength="10">
          <input id="inputExample" class="field" type="text" placeholder="예문 (선택)" maxlength="200">
        </div>
        <p id="dupWarning" class="dup-warning" hidden>이미 있는 단어예요</p>
        <div class="form-actions">
          <button id="addWordBtn" class="btn btn-primary" type="button" disabled>추가</button>
          <button id="cancelEditBtn" class="btn btn-secondary" type="button" hidden>취소</button>
          <button id="bulkToggleBtn" class="btn btn-outline" type="button">일괄 추가</button>
        </div>
      </section>

      <section id="bulkSection" class="bulk-section" hidden>
        <p class="bulk-help">한 줄에 하나씩: <code>단어, 뜻</code> (최대 200줄, 탭으로 구분해도 돼요)</p>
        <textarea id="bulkTextarea" class="bulk-textarea" placeholder="abandon, 포기하다&#10;accomplish, 성취하다"></textarea>
        <div class="form-actions">
          <button id="bulkPreviewBtn" class="btn btn-secondary" type="button">미리보기</button>
          <button id="bulkAddBtn" class="btn btn-primary" type="button" disabled>추가</button>
        </div>
        <ul id="bulkPreviewList" class="bulk-preview"></ul>
      </section>

      <section class="list-section">
        <input id="searchInput" class="field search-field" type="text" placeholder="영단어·뜻 검색">
        <ul id="wordList" class="word-list"></ul>
      </section>
    </div>
  </div>

  <!-- ============ 설정 화면 ============ -->
  <div id="settingsScreen" hidden>
    <header class="topbar">
      <button id="settingsBackBtn" class="icon-btn" aria-label="뒤로 가기" type="button">&larr;</button>
      <span class="app-name">설정</span>
      <span></span>
    </header>

    <div class="manage-body">
      <section class="settings-section">
        <label class="settings-toggle-row">
          <span>카드 넘길 때 발음 자동 재생</span>
          <input id="autoSpeakToggle" type="checkbox">
        </label>
      </section>

      <section class="settings-section">
        <h2 class="settings-heading">백업</h2>
        <p id="settingsWordCount" class="settings-desc"></p>
        <div class="form-actions">
          <button id="exportBtn" class="btn btn-secondary" type="button">내보내기</button>
          <button id="importBtn" class="btn btn-secondary" type="button">불러오기</button>
          <input id="importInput" type="file" accept="application/json" hidden>
        </div>
        <p id="importMsg" class="import-msg" hidden></p>
      </section>

      <section class="settings-section">
        <h2 class="settings-heading">초기화</h2>
        <p class="settings-desc">모든 단어와 학습 기록을 지우고 기본 단어 세트로 되돌려요.</p>
        <button id="resetAllBtn" class="btn btn-danger" type="button">전체 초기화</button>
      </section>
    </div>
  </div>

  <!-- 되돌리기 등 짧은 안내 토스트 -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toastMsg" class="toast-msg"></span>
    <button id="toastUndo" class="toast-undo" type="button" hidden>되돌리기</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
